name: Milestone checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install test dependencies
        run: python -m pip install numpy pandas pytest
      - name: Validate notebook JSON and metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/original_competition_solution.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          assert notebook["nbformat"] == 4
          assert notebook["cells"], "Notebook must contain cells"
          assert all(cell.get("cell_type") in {"markdown", "code", "raw"} for cell in notebook["cells"])
          assert not any(cell.get("outputs") for cell in notebook["cells"]), "Portfolio notebook must not embed outputs"

          print(f"Validated {path} with {len(notebook['cells'])} cells")
          PY
      - name: Run milestone tests
        run: pytest -q
